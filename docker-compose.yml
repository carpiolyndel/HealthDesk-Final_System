version: '3.8'

services:
  healthdesk-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://healthdesk-db:3306/healthdesk
      - SPRING_DATASOURCE_USERNAME=healthdesk
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - HEALTHDESK_ADMIN_PASSWORD=${HEALTHDESK_ADMIN_PASSWORD}
    depends_on:
      - healthdesk-db
    networks:
      - healthdesk-network

  healthdesk-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=healthdesk
      - MYSQL_USER=healthdesk
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    networks:
      - healthdesk-network

volumes:
  mysql_data:

networks:
  healthdesk-network:
    driver: bridge
