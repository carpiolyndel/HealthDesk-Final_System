services:
  - type: web
    name: healthdesk
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /hello
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET_KEY
        generateValue: true
      - key: HEALTHDESK_ADMIN_USERNAME
        value: admin
      - key: HEALTHDESK_ADMIN_EMAIL
        sync: false
      - key: HEALTHDESK_ADMIN_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MFA_DELIVERY_MODE
        value: email
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: APP_LOG_LEVEL
        value: INFO
