services:
  - type: web
    name: healthdesk-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /hello
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET_KEY
        generateValue: true
      - key: HEALTHDESK_ADMIN_USERNAME
        value: admin
      - key: HEALTHDESK_ADMIN_EMAIL
        sync: false
      - key: HEALTHDESK_ADMIN_PASSWORD
        sync: false
      - key: HEALTHDESK_ADMIN_MFA_ENABLED
        value: "true"
      - key: HEALTHDESK_DEMO_USERS_ENABLED
        value: "true"
      - key: HEALTHDESK_DEMO_DOCTOR_PASSWORD
        sync: false
      - key: HEALTHDESK_DEMO_NURSE_PASSWORD
        sync: false
      - key: HEALTHDESK_DEMO_STAFF_PASSWORD
        sync: false
      - key: MFA_DELIVERY_MODE
        value: emailjs
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
