# Test-only datasource. The running app uses MySQL from src/main/resources/application.properties.
spring.datasource.url=jdbc:h2:mem:healthdesk-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

jwt.secret=healthdesk-test-jwt-secret-change-before-production-1234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000

encryption.secret-key=HealthDeskTestEncryptKeyChange32By

mfa.otp.expiration=300000
mfa.otp.length=6
mfa.otp.max-attempts=5
mfa.delivery.mode=console
