# Render backend profile. Use with Neon PostgreSQL or another external PostgreSQL database.
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=${SPRING_DATASOURCE_CONNECTION_TEST_QUERY:SELECT 1}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

healthdesk.initial-admin.password=${HEALTHDESK_ADMIN_PASSWORD:}
healthdesk.demo-users.enabled=${HEALTHDESK_DEMO_USERS_ENABLED:false}
healthdesk.demo.doctor.password=${HEALTHDESK_DEMO_DOCTOR_PASSWORD:}
healthdesk.demo.doctor.email=${HEALTHDESK_DEMO_DOCTOR_EMAIL:doctor@healthdesk.local}
healthdesk.demo.nurse.password=${HEALTHDESK_DEMO_NURSE_PASSWORD:}
healthdesk.demo.nurse.email=${HEALTHDESK_DEMO_NURSE_EMAIL:nurse@healthdesk.local}
healthdesk.demo.staff.password=${HEALTHDESK_DEMO_STAFF_PASSWORD:}
healthdesk.demo.staff.email=${HEALTHDESK_DEMO_STAFF_EMAIL:staff@healthdesk.local}
