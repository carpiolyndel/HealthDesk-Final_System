# Server
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/healthdesk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=false

# H2 Console disabled; HealthDesk uses MySQL by default.
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:healthdesk-local-dev-jwt-secret-change-in-render-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Encryption Configuration
encryption.secret-key=${ENCRYPTION_SECRET_KEY:HealthDeskLocalDevEncryptKey32Byte}

# MFA Configuration
mfa.otp.expiration=300000
mfa.otp.length=6
mfa.otp.max-attempts=5
mfa.delivery.mode=${MFA_DELIVERY_MODE:email}

# EmailJS OTP delivery. Set MFA_DELIVERY_MODE=emailjs and provide these variables to send via EmailJS HTTPS API.
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}

# Email (disabled for testing)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# Logging
logging.level.com.healthdesk=${APP_LOG_LEVEL:INFO}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Initial account provisioning
healthdesk.initial-admin.username=${HEALTHDESK_ADMIN_USERNAME:admin}
healthdesk.initial-admin.email=${HEALTHDESK_ADMIN_EMAIL:}
healthdesk.initial-admin.full-name=${HEALTHDESK_ADMIN_FULL_NAME:System Administrator}
healthdesk.initial-admin.password=${HEALTHDESK_ADMIN_PASSWORD:}
healthdesk.demo-users.enabled=${HEALTHDESK_DEMO_USERS_ENABLED:false}
healthdesk.demo.doctor.password=${HEALTHDESK_DEMO_DOCTOR_PASSWORD:}
healthdesk.demo.doctor.email=${HEALTHDESK_DEMO_DOCTOR_EMAIL:doctor@healthdesk.local}
healthdesk.demo.nurse.password=${HEALTHDESK_DEMO_NURSE_PASSWORD:}
healthdesk.demo.nurse.email=${HEALTHDESK_DEMO_NURSE_EMAIL:nurse@healthdesk.local}
healthdesk.demo.staff.password=${HEALTHDESK_DEMO_STAFF_PASSWORD:}
healthdesk.demo.staff.email=${HEALTHDESK_DEMO_STAFF_EMAIL:staff@healthdesk.local}
