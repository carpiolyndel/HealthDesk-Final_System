# Server
server.port=8080

# MySQL Database Configuration (default local development)
spring.datasource.url=jdbc:mysql://localhost:3306/healthdesk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console disabled; HealthDesk uses MySQL by default.
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:healthdesk-dev-jwt-secret-change-before-production-1234567890}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Encryption Configuration
encryption.secret-key=${ENCRYPTION_SECRET_KEY:HealthDeskDevEncryptKeyChangeMe32Byte}

# MFA Configuration
mfa.otp.expiration=300000
mfa.otp.length=6
mfa.otp.max-attempts=5
mfa.delivery.mode=console

# Email (disabled for testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=healthdesk.info1@gmail.com
spring.mail.password=upcd fvqy mjwt ndnf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.healthdesk=DEBUG
