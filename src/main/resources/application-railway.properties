# Railway profile. Use this when the backend and MySQL are in the same Railway project.
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:-1}
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://healthdesk-clinic.up.railway.app}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:true}
server.forward-headers-strategy=framework
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

healthdesk.initial-admin.password=${HEALTHDESK_ADMIN_PASSWORD:Admin12345!}
healthdesk.demo-users.enabled=${HEALTHDESK_DEMO_USERS_ENABLED:true}
healthdesk.demo.doctor.password=${HEALTHDESK_DEMO_DOCTOR_PASSWORD:Demo12345!}
healthdesk.demo.doctor.email=${HEALTHDESK_DEMO_DOCTOR_EMAIL:doctor@healthdesk.local}
healthdesk.demo.nurse.password=${HEALTHDESK_DEMO_NURSE_PASSWORD:Demo12345!}
healthdesk.demo.nurse.email=${HEALTHDESK_DEMO_NURSE_EMAIL:nurse@healthdesk.local}
healthdesk.demo.staff.password=${HEALTHDESK_DEMO_STAFF_PASSWORD:Demo12345!}
healthdesk.demo.staff.email=${HEALTHDESK_DEMO_STAFF_EMAIL:staff@healthdesk.local}
