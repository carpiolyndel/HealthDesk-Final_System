# Railway profile. Use this when the backend and MySQL are in the same Railway project.
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

healthdesk.initial-admin.password=${HEALTHDESK_ADMIN_PASSWORD:Admin12345!}
healthdesk.demo-users.enabled=${HEALTHDESK_DEMO_USERS_ENABLED:true}
healthdesk.demo.doctor.password=${HEALTHDESK_DEMO_DOCTOR_PASSWORD:Demo12345!}
healthdesk.demo.nurse.password=${HEALTHDESK_DEMO_NURSE_PASSWORD:Demo12345!}
healthdesk.demo.staff.password=${HEALTHDESK_DEMO_STAFF_PASSWORD:Demo12345!}
