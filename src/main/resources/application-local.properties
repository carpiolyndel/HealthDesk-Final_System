# Local trial profile. Use this only on your laptop:
# $env:SPRING_PROFILES_ACTIVE="local"; .\mvnw.cmd spring-boot:run

spring.datasource.url=jdbc:h2:mem:healthdesk-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/api/h2-console

healthdesk.initial-admin.username=${HEALTHDESK_ADMIN_USERNAME:admin}
healthdesk.initial-admin.email=${HEALTHDESK_ADMIN_EMAIL:admin@healthdesk.local}
healthdesk.initial-admin.full-name=${HEALTHDESK_ADMIN_FULL_NAME:Local Admin}
healthdesk.initial-admin.password=${HEALTHDESK_ADMIN_PASSWORD:Admin12345!}

mfa.delivery.mode=${MFA_DELIVERY_MODE:console}
